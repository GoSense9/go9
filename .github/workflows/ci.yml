name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/go9
      - run: CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build ./cmd/go9
      - name: Validate FreeBSD shell scripts
        run: find freebsd -type f -name '*.sh' -exec sh -n {} \;
